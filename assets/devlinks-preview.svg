<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Preview do DevLinks</title>
  <desc id="desc">Layout escuro com navegação, texto principal e botões.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#020812"/>
      <stop offset="100%" stop-color="#030a17"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#b9c2ff"/>
      <stop offset="35%" stop-color="#8fa2ff"/>
      <stop offset="100%" stop-color="#7c6ee8"/>
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1b243d" stroke-width="1" opacity="0.4"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6f5af7" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.9"/>

  <g opacity="0.9">
    <rect x="0" y="0" width="1600" height="74" fill="rgba(11,18,31,0.7)" stroke="#25304a"/>
    <line x1="0" y1="75" x2="1600" y2="75" stroke="#1c2947"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" fill="#dfe8ff">
    <text x="164" y="48" font-size="28" font-weight="700" letter-spacing="1.5" fill="#c7d3ff">LEONARDO</text>
    <text x="392" y="48" font-size="28" font-weight="700" letter-spacing="1" fill="#8f9cea">. DEV</text>

    <g font-size="17" fill="#dfe6ff" opacity="0.8">
      <text x="695" y="48">Sobre</text>
      <text x="800" y="48">Competencias</text>
      <text x="980" y="48">Projetos</text>
      <text x="1098" y="48">Contato</text>
    </g>

    <g>
      <rect x="1248" y="16" width="190" height="42" rx="8" fill="rgba(110,120,255,0.04)" stroke="#6f75d8"/>
      <text x="1274" y="44" font-size="18" fill="#bbc5ff">Disponivel para o Trabalho</text>
    </g>
  </g>

  <g transform="translate(220,110)">
    <g filter="url(#softShadow)">
      <rect x="0" y="112" width="260" height="38" rx="19" fill="rgba(126,112,250,0.08)"/>
      <circle cx="20" cy="131" r="5" fill="#8f7ef0"/>
      <text x="38" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#b6bcff">Disponivel para novos projetos</text>
    </g>

    <g>
      <text x="0" y="245" font-family="Segoe UI, Arial, sans-serif" font-size="120" font-weight="700" fill="#f0f3ff" letter-spacing="-4">Leonardo</text>
      <text x="0" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="120" font-weight="700" fill="url(#purpleGlow)" letter-spacing="-4">Ravache</text>
    </g>

    <g>
      <rect x="0" y="390" width="4" height="58" fill="#8e8af5" opacity="0.9"/>
    </g>

    <g font-family="Segoe UI, Arial, sans-serif" fill="#dfe8ff" opacity="0.85">
      <text x="0" y="490" font-size="25">Rumo a me tornar um desenvolvedor fullstack, com foco</text>
      <text x="0" y="524" font-size="25">na criação e manutenção de sistemas, manutenção de</text>
      <text x="0" y="558" font-size="25">computadores e placas Raspberry Pi, além de</text>
      <text x="0" y="592" font-size="25">experiências em automações com n8n. Objetivo:</text>
      <text x="0" y="626" font-size="25">trabalhar futuramente com Machine Learning e Deep</text>
      <text x="0" y="660" font-size="25">Learning.</text>
    </g>

    <g transform="translate(0,700)">
      <rect x="0" y="0" width="190" height="56" rx="12" fill="#7a72ff"/>
      <text x="58" y="35" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#f5f7ff">Ver Projetos</text>
      <text x="158" y="35" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#f5f7ff">→</text>

      <rect x="205" y="0" width="140" height="56" rx="12" fill="rgba(255,255,255,0.03)" stroke="#2d3348"/>
      <text x="256" y="35" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#edf3ff">Contato</text>
    </g>
  </g>

  <g>
    <text x="800" y="845" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#a5afd4" text-anchor="middle">Scroll</text>
    <path d="M 800 860 L 795 870 L 800 875 L 805 870 Z" fill="#a5afd4"/>
  </g>
</svg>














































































































